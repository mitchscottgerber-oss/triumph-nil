<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Triumph NIL — Receipts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #f1efe8;
    --card: #ffffff;
    --border: #e1dcd6;
    --black: #141414;
    --gray: #8c8a84;
    --blue: #185fa5;
    --blue-bg: #e7f1fb;
    --green: #27804c;
    --footer-bg: #f7f6f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--black); }

  /* ---------- Token gate ---------- */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #gate-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 340px; }
  #gate-card h1 { font-size: 18px; margin: 0 0 4px; }
  #gate-card p { font-size: 13px; color: var(--gray); margin: 0 0 20px; line-height: 1.5; }
  #gate-card input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: monospace; }
  #gate-card button { width: 100%; padding: 10px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #gate-error { color: #a32d2d; font-size: 13px; margin-top: 10px; }

  /* ---------- Hub layout ---------- */
  #hub { display: none; min-height: 100vh; }
  #sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; margin: 0 0 16px; }

  #nav-tabs { display: flex; gap: 4px; margin-bottom: 18px; background: var(--bg); border-radius: 8px; padding: 3px; }
  .nav-tab { flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: 7px 0; border-radius: 6px; cursor: pointer; color: var(--gray); }
  .nav-tab.active { background: var(--card); color: var(--black); }

  #sport-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .sport-tab { font-size: 11px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); cursor: pointer; }
  .sport-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  #athlete-search { width: 100%; padding: 8px 10px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  #athlete-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .athlete-row { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .athlete-row:hover { background: var(--bg); }
  .athlete-row.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
  .athlete-row span.sport { color: var(--gray); font-size: 11px; }

  #main { flex: 1; padding: 32px 40px; overflow-y: auto; }
  .main-empty { color: var(--gray); font-size: 14px; }
  .panel-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .panel-header h2 { margin: 0; font-size: 22px; }
  .panel-header p { margin: 4px 0 0; color: var(--gray); font-size: 13px; }
  .panel-actions { display: flex; gap: 8px; }
  .btn-secondary { background: var(--card); color: var(--black); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  #deal-list { display: flex; flex-direction: column; gap: 8px; max-width: 560px; margin-top: 24px; }
  .deal-row { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .deal-row .deal-name { font-weight: 600; font-size: 14px; }
  .deal-row .deal-meta { color: var(--gray); font-size: 12px; margin-top: 2px; }
  .proof-yes { color: var(--green); font-weight: 600; }
  .proof-no { color: var(--gray); }
  .deal-row button { background: var(--blue); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .deal-row button:disabled { background: var(--gray); }

  .receipt-preview { margin-top: 28px; }
  .receipt-preview a.download-link { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--blue); text-decoration: none; }

  /* ---------- Receipt card ---------- */
  .receipt-card { width: 640px; background: var(--card); border: 2px solid var(--border); border-radius: 24px; overflow: hidden; }
  .receipt-header { display: flex; justify-content: space-between; padding: 32px 36px 0; }
  .receipt-eyebrow { font-size: 15px; font-weight: 700; color: var(--gray); }
  .receipt-name { font-size: 30px; font-weight: 700; margin: 10px 0 0; }
  .receipt-sub { font-size: 17px; color: var(--gray); margin: 8px 0 0; }
  .receipt-month { font-size: 18px; font-weight: 700; text-align: right; }
  .receipt-code { font-size: 12px; color: var(--gray); font-family: monospace; margin-top: 10px; text-align: right; }
  .receipt-band { display: flex; justify-content: space-between; align-items: center; background: var(--blue-bg); padding: 20px 36px; margin-top: 40px; }
  .receipt-band-label { font-size: 14px; font-weight: 700; color: var(--blue); }
  .receipt-band-amt { font-size: 28px; font-weight: 700; color: var(--blue); }
  .receipt-body { padding: 26px 36px 8px; }
  .receipt-section-label { font-size: 15px; font-weight: 700; color: var(--gray); margin-bottom: 6px; }
  .receipt-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .receipt-row:last-child { border-bottom: none; }
  .receipt-row-top { display: flex; justify-content: space-between; }
  .receipt-sponsor-name { font-size: 19px; font-weight: 700; }
  .receipt-sponsor-amt { font-size: 17px; font-weight: 700; }
  .receipt-proof { font-size: 14px; font-weight: 700; color: var(--green); margin-top: 6px; }
  .receipt-type { font-size: 14px; color: var(--gray); margin-top: 6px; }
  .receipt-footer { display: flex; justify-content: space-between; align-items: flex-end; background: var(--footer-bg); border-top: 2px solid var(--border); padding: 18px 36px; margin-top: 12px; }
  .receipt-date { font-size: 14px; color: var(--gray); }
  .receipt-total-label { font-size: 13px; color: var(--gray); text-align: right; }
  .receipt-total-amt { font-size: 24px; font-weight: 700; text-align: right; margin-top: 4px; }

  /* ---------- Payment split editor ---------- */
  #split-editor { display: none; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; max-width: 520px; margin-top: 24px; }
  #split-editor .split-label { font-size: 12px; color: var(--gray); }
  #split-editor input[type=text], #split-editor input[type=number] { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  #split-total-input { width: 100%; font-size: 18px; font-weight: 600; margin-top: 4px; margin-bottom: 18px; }
  .split-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .split-row input[name=split-name] { flex: 1; }
  .split-row input[name=split-amt] { width: 120px; }
  .split-proof-badge { width: 60px; text-align: center; }
  .split-row .split-remove { cursor: pointer; color: var(--gray); font-size: 13px; }
  #split-add-btn { background: none; border: 1px dashed var(--border); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-bottom: 16px; }
  #split-status { font-size: 13px; margin-right: 12px; }
  #split-status.ok { color: var(--green); }
  #split-status.bad { color: #a32d2d; }
  #split-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border); }

  /* ---------- Company reports view ---------- */
  #reports-view { display: none; }
  .report-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  .report-toggle { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; }
  .report-toggle span { padding: 7px 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; color: var(--gray); }
  .report-toggle span.active { background: var(--card); color: var(--black); }
  #report-controls select, #report-controls input[type=month] { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>

<!-- ============== TOKEN GATE ============== -->
<div id="gate">
  <div id="gate-card">
    <h1>Triumph NIL — Receipts</h1>
    <p>Paste your Monday.com API token to load the board. It's stored only in this browser, never sent anywhere but Monday's API.</p>
    <input type="password" id="token-input" placeholder="Monday API token" />
    <button id="gate-btn">Load board</button>
    <p id="gate-error" style="display:none;"></p>
  </div>
</div>

<!-- ============== HUB ============== -->
<div id="hub">
  <div id="sidebar">
    <h1>Triumph NIL</h1>
    <div id="nav-tabs">
      <div class="nav-tab active" data-view="athletes">Athletes</div>
      <div class="nav-tab" data-view="reports">Company reports</div>
    </div>

    <div id="athlete-nav">
      <div id="sport-tabs"></div>
      <input type="text" id="athlete-search" placeholder="Search athletes" />
      <div id="athlete-list"></div>
    </div>
  </div>

  <div id="main">
    <!-- Athlete view -->
    <div id="athletes-view">
      <div id="main-empty" class="main-empty">Select an athlete to view their activations.</div>
      <div id="athlete-panel" style="display:none;">
        <div class="panel-header">
          <div>
            <h2 id="panel-athlete-name"></h2>
            <p id="panel-athlete-sport"></p>
          </div>
          <div class="panel-actions">
            <button class="btn-secondary" id="master-report-btn">Generate master report</button>
            <button class="btn-secondary" id="split-editor-btn">Adjust monthly payment</button>
          </div>
        </div>

        <div id="split-editor">
          <label class="split-label">Total paid this month</label>
          <input type="number" id="split-total-input" value="0" />
          <p class="split-label" style="margin-bottom:10px;">SPLIT ACROSS SOURCES</p>
          <div id="split-rows"></div>
          <button id="split-add-btn">+ Add source</button>
          <div id="split-footer">
            <span id="split-status"></span>
            <button class="btn-primary" id="split-generate-btn">Generate master report</button>
          </div>
        </div>

        <div id="deal-list"></div>
        <div id="athlete-receipt-preview" class="receipt-preview"></div>
      </div>
    </div>

    <!-- Company reports view -->
    <div id="reports-view">
      <div class="report-controls">
        <div class="report-toggle" id="report-dimension-toggle">
          <span class="active" data-dim="sponsor">Sponsor</span>
          <span data-dim="sourceOfFunds">Source of funds</span>
        </div>
        <select id="report-company-select"></select>
        <div class="report-toggle" id="report-time-toggle">
          <span class="active" data-time="all">All time</span>
          <span data-time="month">Month</span>
          <span data-time="year">Year</span>
        </div>
        <input type="month" id="report-month-input" style="display:none;" />
        <input type="number" id="report-year-input" placeholder="2026" min="2000" max="2100" style="display:none; width:80px;" />
        <button class="btn-primary" id="report-generate-btn">Generate report</button>
      </div>
      <div id="reports-receipt-preview" class="receipt-preview"></div>
    </div>
  </div>
</div>

<script>
  const BOARD_ID = "18426231628";
  const COLUMN_IDS = {
    athlete: "text_mm65x60d",
    amount: "numeric_mm65zbte",
    sponsor: "dropdown_mm655bh8",
    activationType: "dropdown_mm65dpw",
    sourceOfFunds: "dropdown_mm65jwx4",
    sport: "dropdown_mm65p78b",
    proofOfWork: "file_mm65n91m",
    clearedDate: "date_mm66vcbs",
    sow: "file_mm6ak8c5",
  };
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  let mondayToken = localStorage.getItem("monday_token") || "";
  let allDeals = [];
  let activeSport = "All";
  let currentAthlete = null;
  let reportDimension = "sponsor";
  let reportTime = "all";

  // ---- Token gate ----
  if (mondayToken) document.getElementById("token-input").value = mondayToken;
  document.getElementById("gate-btn").addEventListener("click", async () => {
    const token = document.getElementById("token-input").value.trim();
    const errorEl = document.getElementById("gate-error");
    errorEl.style.display = "none";
    if (!token) return;
    try {
      const deals = await loadBoard(token);
      mondayToken = token;
      localStorage.setItem("monday_token", token);
      allDeals = deals;
      document.getElementById("gate").style.display = "none";
      document.getElementById("hub").style.display = "flex";
      renderSportTabs();
      renderAthleteList();
      populateCompanySelect();
    } catch (err) {
      errorEl.textContent = "Couldn't load board: " + err.message;
      errorEl.style.display = "block";
    }
  });
  if (mondayToken) document.getElementById("gate-btn").click();

  // ---- Monday API ----
  async function mondayQuery(token, query, variables) {
    const res = await fetch("https://api.monday.com/v2", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": token },
      body: JSON.stringify({ query, variables }),
    });
    const json = await res.json();
    if (json.errors) throw new Error(json.errors.map(e => e.message).join("; "));
    return json.data;
  }

  async function loadBoard(token) {
    const query = `
      query ($boardId: ID!) {
        boards (ids: [$boardId]) {
          items_page (limit: 500) {
            items {
              id
              name
              column_values (ids: ${JSON.stringify(Object.values(COLUMN_IDS))}) {
                id
                text
                value
              }
            }
          }
        }
      }
    `;
    const data = await mondayQuery(token, query, { boardId: BOARD_ID });
    return data.boards[0].items_page.items.map(parseItem);
  }

  function parseItem(item) {
    const byId = Object.fromEntries(item.column_values.map(cv => [cv.id, cv]));
    // Files columns: `text` reliably returns a comma-separated list of
    // public URLs when files are attached, and an empty string when not —
    // confirmed against real data, unlike the `value` JSON shape.
    const proofText = byId[COLUMN_IDS.proofOfWork]?.text ?? "";
    const sowText = byId[COLUMN_IDS.sow]?.text ?? "";
    const hasProof = Boolean(proofText.trim());
    const hasSOW = Boolean(sowText.trim());

    return {
      itemId: item.id,
      dealName: item.name,
      athlete: byId[COLUMN_IDS.athlete]?.text ?? "",
      amount: parseFloat(byId[COLUMN_IDS.amount]?.text || "0") || 0,
      sponsor: byId[COLUMN_IDS.sponsor]?.text ?? "",
      activationType: byId[COLUMN_IDS.activationType]?.text ?? "",
      sourceOfFunds: byId[COLUMN_IDS.sourceOfFunds]?.text ?? "",
      sport: byId[COLUMN_IDS.sport]?.text ?? "",
      hasProof,
      hasSOW,
      clearedDate: byId[COLUMN_IDS.clearedDate]?.text ?? "", // "YYYY-MM-DD" or ""
    };
  }

  function fmt(amount) {
    return Number(amount).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  // ---- Nav tabs ----
  document.querySelectorAll(".nav-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const view = tab.dataset.view;
      document.getElementById("athlete-nav").style.display = view === "athletes" ? "block" : "none";
      document.getElementById("athletes-view").style.display = view === "athletes" ? "block" : "none";
      document.getElementById("reports-view").style.display = view === "reports" ? "block" : "none";
    });
  });

  // ---- Sidebar: athletes ----
  function renderSportTabs() {
    const sports = ["All", ...new Set(allDeals.map(d => d.sport).filter(Boolean))];
    const wrap = document.getElementById("sport-tabs");
    wrap.innerHTML = "";
    sports.forEach(sport => {
      const el = document.createElement("span");
      el.className = "sport-tab" + (sport === activeSport ? " active" : "");
      el.textContent = sport;
      el.addEventListener("click", () => { activeSport = sport; renderSportTabs(); renderAthleteList(); });
      wrap.appendChild(el);
    });
  }

  function renderAthleteList() {
    const query = document.getElementById("athlete-search").value.toLowerCase();
    const byAthlete = {};
    allDeals.forEach(d => {
      if (!d.athlete) return;
      if (!byAthlete[d.athlete]) byAthlete[d.athlete] = { name: d.athlete, sport: d.sport, deals: [] };
      byAthlete[d.athlete].deals.push(d);
    });
    const list = document.getElementById("athlete-list");
    list.innerHTML = "";
    Object.values(byAthlete)
      .filter(a => activeSport === "All" || a.sport === activeSport)
      .filter(a => a.name.toLowerCase().includes(query))
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(a => {
        const row = document.createElement("div");
        row.className = "athlete-row";
        row.innerHTML = `<span>${a.name}</span><span class="sport">${a.sport}</span>`;
        row.addEventListener("click", () => selectAthlete(a));
        list.appendChild(row);
      });
  }
  document.getElementById("athlete-search").addEventListener("input", renderAthleteList);

  // ---- Athlete panel ----
  function selectAthlete(athlete) {
    currentAthlete = athlete;
    document.getElementById("main-empty").style.display = "none";
    document.getElementById("athlete-panel").style.display = "block";
    document.getElementById("athlete-receipt-preview").innerHTML = "";
    document.getElementById("split-editor").style.display = "none";
    document.getElementById("panel-athlete-name").textContent = athlete.name;
    document.getElementById("panel-athlete-sport").textContent = athlete.sport + " · Virginia Tech";

    const dealList = document.getElementById("deal-list");
    dealList.innerHTML = "";
    athlete.deals.forEach(deal => {
      const row = document.createElement("div");
      row.className = "deal-row";
      row.innerHTML = `
        <div>
          <div class="deal-name">${deal.dealName}</div>
          <div class="deal-meta">${deal.sponsor} · $${fmt(deal.amount)}${deal.hasProof ? ` · <span class="proof-yes">&#10003; Proof on file</span>` : ` · <span class="proof-no">No proof on file</span>`}${deal.hasSOW ? ` · <span class="proof-yes">&#10003; SOW on file</span>` : ` · <span class="proof-no">No SOW on file</span>`}</div>
        </div>
        <button>Generate report</button>
      `;
      row.querySelector("button").addEventListener("click", (e) => generateSingleReceipt(deal, e.target, "athlete-receipt-preview"));
      dealList.appendChild(row);
    });
  }

  document.getElementById("master-report-btn").addEventListener("click", () => {
    if (!currentAthlete) return;
    const rows = currentAthlete.deals.map(d => ({
      name: d.sponsor, amount: d.amount, meta: `${d.activationType} · via ${d.sourceOfFunds}`, hasProof: d.hasProof, hasSOW: d.hasSOW,
    }));
    const total = rows.reduce((s, r) => s + r.amount, 0);
    renderRollupReceipt({
      name: currentAthlete.name, sport: currentAthlete.sport, total, rows,
      target: "athlete-receipt-preview", filenamePrefix: currentAthlete.name,
    });
  });

  // ---- Payment split editor ----
  document.getElementById("split-editor-btn").addEventListener("click", () => {
    if (!currentAthlete) return;
    const editor = document.getElementById("split-editor");
    editor.style.display = editor.style.display === "none" ? "block" : "none";
    if (editor.style.display === "block") {
      const total = currentAthlete.deals.reduce((s, d) => s + d.amount, 0);
      document.getElementById("split-total-input").value = total;
      const rowsWrap = document.getElementById("split-rows");
      rowsWrap.innerHTML = "";
      currentAthlete.deals.forEach(d => addSplitRow(d.sponsor, d.amount, d.hasProof, d.hasSOW, `${d.activationType} · via ${d.sourceOfFunds}`));
      updateSplitStatus();
    }
  });

  function addSplitRow(name, amount, hasProof, hasSOW, meta) {
    const row = document.createElement("div");
    row.className = "split-row";
    row.dataset.hasProof = hasProof ? "1" : "0";
    row.dataset.hasSow = hasSOW ? "1" : "0";
    row.dataset.meta = meta || "";
    const proofBadge = hasProof
      ? `<span class="proof-yes" style="font-size:11px; white-space:nowrap;">&#10003; Proof</span>`
      : (name ? `<span class="proof-no" style="font-size:11px; white-space:nowrap;">No proof</span>` : "");
    row.innerHTML = `
      <input type="text" name="split-name" value="${name || ""}" placeholder="Source name" />
      <input type="number" name="split-amt" value="${amount || 0}" />
      <span class="split-proof-badge">${proofBadge}</span>
      <span class="split-remove">&#10005;</span>
    `;
    row.querySelector(".split-remove").addEventListener("click", () => { row.remove(); updateSplitStatus(); });
    row.querySelectorAll("input").forEach(inp => inp.addEventListener("input", updateSplitStatus));
    document.getElementById("split-rows").appendChild(row);
  }
  document.getElementById("split-add-btn").addEventListener("click", () => addSplitRow("", 0, false, false, ""));
  document.getElementById("split-total-input").addEventListener("input", updateSplitStatus);

  function readSplitRows() {
    return Array.from(document.querySelectorAll("#split-rows .split-row")).map(row => ({
      name: row.querySelector("[name=split-name]").value || "Unlabeled",
      amount: parseFloat(row.querySelector("[name=split-amt]").value) || 0,
      hasProof: row.dataset.hasProof === "1",
      hasSOW: row.dataset.hasSow === "1",
      meta: row.dataset.meta || "",
    }));
  }

  function updateSplitStatus() {
    const total = parseFloat(document.getElementById("split-total-input").value) || 0;
    const rows = readSplitRows();
    const allocated = rows.reduce((s, r) => s + r.amount, 0);
    const statusEl = document.getElementById("split-status");
    const diff = Math.round((total - allocated) * 100) / 100;
    if (diff === 0) {
      statusEl.textContent = "✓ Fully allocated";
      statusEl.className = "ok";
    } else if (diff > 0) {
      statusEl.textContent = `$${fmt(diff)} unallocated`;
      statusEl.className = "bad";
    } else {
      statusEl.textContent = `$${fmt(Math.abs(diff))} over-allocated`;
      statusEl.className = "bad";
    }
  }

  document.getElementById("split-generate-btn").addEventListener("click", () => {
    if (!currentAthlete) return;
    const total = parseFloat(document.getElementById("split-total-input").value) || 0;
    const rows = readSplitRows().map(r => ({ name: r.name, amount: r.amount, meta: r.meta, hasProof: r.hasProof, hasSOW: r.hasSOW }));
    renderRollupReceipt({
      name: currentAthlete.name, sport: currentAthlete.sport, total, rows,
      target: "athlete-receipt-preview", filenamePrefix: currentAthlete.name, monthPayment: true,
    });
  });

  // ---- Company reports ----
  document.getElementById("report-dimension-toggle").addEventListener("click", (e) => {
    if (e.target.tagName !== "SPAN") return;
    reportDimension = e.target.dataset.dim;
    document.querySelectorAll("#report-dimension-toggle span").forEach(s => s.classList.remove("active"));
    e.target.classList.add("active");
    populateCompanySelect();
  });

  document.getElementById("report-time-toggle").addEventListener("click", (e) => {
    if (e.target.tagName !== "SPAN") return;
    reportTime = e.target.dataset.time;
    document.querySelectorAll("#report-time-toggle span").forEach(s => s.classList.remove("active"));
    e.target.classList.add("active");
    document.getElementById("report-month-input").style.display = reportTime === "month" ? "inline-block" : "none";
    document.getElementById("report-year-input").style.display = reportTime === "year" ? "inline-block" : "none";
  });

  function populateCompanySelect() {
    const values = [...new Set(allDeals.map(d => d[reportDimension]).filter(Boolean))].sort();
    const label = reportDimension === "sponsor" ? "Sponsors" : "Sources of funds";
    const sel = document.getElementById("report-company-select");
    sel.innerHTML = `<option value="__ALL__">All ${label}</option>` + values.map(v => `<option value="${v}">${v}</option>`).join("");
  }

  function monthLabelFromDate(dateStr) {
    if (!dateStr) return "No date on file";
    const [y, m] = dateStr.split("-");
    return `${MONTHS[parseInt(m, 10) - 1]} ${y}`;
  }

  document.getElementById("report-generate-btn").addEventListener("click", () => {
    const company = document.getElementById("report-company-select").value;
    if (!company) return;

    let deals = allDeals;
    let periodLabel = "ALL-TIME";
    if (reportTime === "month") {
      const monthVal = document.getElementById("report-month-input").value; // "YYYY-MM"
      if (!monthVal) { alert("Pick a month first."); return; }
      deals = deals.filter(d => d.clearedDate && d.clearedDate.startsWith(monthVal));
      const [y, m] = monthVal.split("-");
      periodLabel = `${MONTHS[parseInt(m, 10) - 1].toUpperCase()} ${y}`;
    } else if (reportTime === "year") {
      const yearVal = document.getElementById("report-year-input").value; // "YYYY"
      if (!yearVal) { alert("Pick a year first."); return; }
      deals = deals.filter(d => d.clearedDate && d.clearedDate.startsWith(yearVal));
      periodLabel = yearVal;
    }

    if (company === "__ALL__") {
      // Summary across every sponsor (or every source of funds) for the period.
      const label = reportDimension === "sponsor" ? "ALL SPONSORS" : "ALL SOURCES OF FUNDS";
      const byLabel = reportDimension === "sponsor" ? "BY SPONSOR" : "BY SOURCE OF FUNDS";
      const grouped = {};
      deals.forEach(d => {
        const key = d[reportDimension];
        if (!key) return;
        if (!grouped[key]) grouped[key] = { total: 0, contributors: [] };
        grouped[key].total += d.amount;
        grouped[key].contributors.push(`${d.athlete} (${monthLabelFromDate(d.clearedDate)})`);
      });
      const rows = Object.entries(grouped)
        .sort((a, b) => b[1].total - a[1].total)
        .map(([name, g]) => ({ name, amount: g.total, meta: g.contributors.join(", ") }));
      const total = rows.reduce((s, r) => s + r.amount, 0);
      renderRollupReceipt({
        name: label, sport: `${periodLabel} · CLEARED`, total, rows,
        target: "reports-receipt-preview", filenamePrefix: label, byLabel,
        bandLabel: "TOTAL NIL PAYOUT",
      });
      return;
    }

    deals = deals.filter(d => d[reportDimension] === company);
    const rows = deals.map(d => ({
      name: d.athlete, amount: d.amount,
      meta: `${d.dealName} · ${d.sport} · ${monthLabelFromDate(d.clearedDate)}`,
      hasProof: d.hasProof, hasSOW: d.hasSOW,
    }));
    const total = rows.reduce((s, r) => s + r.amount, 0);
    renderRollupReceipt({
      name: company, sport: `${periodLabel} · CLEARED`, total, rows,
      target: "reports-receipt-preview", filenamePrefix: company, byLabel: "BY ATHLETE",
      bandLabel: "TOTAL NIL PAYOUT",
    });
  });

  // ---- Shared rendering ----
  function dateFields(name) {
    const now = new Date();
    const monthShort = MONTHS[now.getMonth()];
    const year = now.getFullYear();
    const initials = name.split(" ").map(w => w[0]).join("").toUpperCase();
    return {
      month: `${monthShort} ${year}`,
      code: `TRI-${initials}-${monthShort.toUpperCase()}-${String(year).slice(-2)}`,
      date: `${monthShort} ${now.getDate()}, ${year}`,
    };
  }

  function buildSingleReceiptCard(deal) {
    const d = dateFields(deal.athlete);
    const card = document.createElement("div");
    card.className = "receipt-card";
    card.innerHTML = `
      <div class="receipt-header">
        <div>
          <div class="receipt-eyebrow">TRIUMPH · RECEIPT</div>
          <div class="receipt-name">${deal.athlete}</div>
          <div class="receipt-sub">${deal.sport} · Virginia Tech</div>
        </div>
        <div>
          <div class="receipt-month">${d.month}</div>
          <div class="receipt-code">${d.code}</div>
        </div>
      </div>
      <div class="receipt-band">
        <span class="receipt-band-label">TOTAL NIL PAYMENT</span>
        <span class="receipt-band-amt">$${fmt(deal.amount)}</span>
      </div>
      <div class="receipt-body">
        <div class="receipt-section-label">SOURCE OF FUNDS</div>
        <div class="receipt-row" style="border-bottom:none;">
          <div class="receipt-row-top">
            <span class="receipt-sponsor-name">${deal.sponsor}</span>
            <span class="receipt-sponsor-amt">$${fmt(deal.amount)}</span>
          </div>
          ${deal.hasProof ? `<div class="receipt-proof">&#10003; Proof of work available</div>` : ``}
          ${deal.hasSOW ? `<div class="receipt-proof">&#10003; Signed SOW available</div>` : ``}
          <div class="receipt-type">${deal.activationType} · via ${deal.sourceOfFunds}</div>
        </div>
      </div>
      <div class="receipt-footer">
        <span class="receipt-date">${d.date}</span>
        <div>
          <div class="receipt-total-label">Total</div>
          <div class="receipt-total-amt">$${fmt(deal.amount)}</div>
        </div>
      </div>
    `;
    return card;
  }

  function buildRollupReceiptCard({ name, sport, total, rows, byLabel, monthPayment, bandLabel }) {
    const d = dateFields(name);
    const card = document.createElement("div");
    card.className = "receipt-card";
    const rowsHtml = rows.map(r => `
      <div class="receipt-row">
        <div class="receipt-row-top">
          <span class="receipt-sponsor-name" style="font-size:17px;">${r.name}</span>
          <span class="receipt-sponsor-amt">$${fmt(r.amount)}</span>
        </div>
        ${r.hasProof ? `<div class="receipt-proof">&#10003; Proof of work available</div>` : ``}
        ${r.hasSOW ? `<div class="receipt-proof">&#10003; Signed SOW available</div>` : ``}
        ${r.meta ? `<div class="receipt-type">${r.meta}</div>` : ``}
      </div>
    `).join("");
    card.innerHTML = `
      <div class="receipt-header">
        <div>
          <div class="receipt-eyebrow">TRIUMPH · ${monthPayment ? "MONTHLY RECEIPT" : "MASTER RECEIPT"}</div>
          <div class="receipt-name">${name}</div>
          <div class="receipt-sub">${sport}</div>
        </div>
        <div>
          <div class="receipt-month">${d.month}</div>
          <div class="receipt-code">${d.code}</div>
        </div>
      </div>
      <div class="receipt-band">
        <span class="receipt-band-label">${bandLabel || "TOTAL NIL PAYMENT"}</span>
        <span class="receipt-band-amt">$${fmt(total)}</span>
      </div>
      <div class="receipt-body">
        <div class="receipt-section-label">${byLabel || "SOURCE OF FUNDS"}</div>
        ${rowsHtml || `<p style="color:var(--gray); font-size:13px;">No line items.</p>`}
      </div>
      <div class="receipt-footer">
        <span class="receipt-date">${d.date}</span>
        <div>
          <div class="receipt-total-label">Total</div>
          <div class="receipt-total-amt">$${fmt(total)}</div>
        </div>
      </div>
    `;
    return card;
  }

  async function captureAndShow(cardBuilder, target, filenamePrefix) {
    const preview = document.getElementById(target);
    preview.innerHTML = "<p style='color:var(--gray);font-size:13px;'>Generating…</p>";
    const holder = document.createElement("div");
    holder.style.position = "fixed";
    holder.style.left = "-9999px";
    const card = cardBuilder();
    holder.appendChild(card);
    document.body.appendChild(holder);
    const canvas = await html2canvas(card, { scale: 2, backgroundColor: "#ffffff" });
    document.body.removeChild(holder);
    const dataUrl = canvas.toDataURL("image/png");

    preview.innerHTML = "";
    const img = document.createElement("img");
    img.src = dataUrl;
    img.style.maxWidth = "320px";
    img.style.borderRadius = "12px";
    img.style.border = "1px solid var(--border)";
    const link = document.createElement("a");
    link.href = dataUrl;
    link.download = `${filenamePrefix.replace(/\s+/g, "_")}_receipt.png`;
    link.textContent = "Download PNG";
    link.className = "download-link";
    preview.appendChild(img);
    preview.appendChild(document.createElement("br"));
    preview.appendChild(link);
  }

  async function generateSingleReceipt(deal, btn, target) {
    btn.disabled = true;
    btn.textContent = "Generating…";
    try {
      await captureAndShow(() => buildSingleReceiptCard(deal), target, deal.athlete);
    } catch (err) {
      alert("Couldn't generate receipt: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate report";
    }
  }

  async function renderRollupReceipt(opts) {
    try {
      await captureAndShow(() => buildRollupReceiptCard(opts), opts.target, opts.filenamePrefix);
    } catch (err) {
      alert("Couldn't generate report: " + err.message);
    }
  }
</script>
</body>
</html>
